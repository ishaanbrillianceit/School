<div class="background py-1">
  <div class="row">
    <div class="col-sm-2 bg-danger text-end fs-6 fw-bold">
      Upcoming Events:-
    </div>
    <div class="col-sm-10 flex align-items-center">
      <marquee
        behavior="scroll"
        direction="left"
        scrollamount="15"
        class="notice"
        onmouseover="this.stop();"
        onmouseout="this.start();"
      >
        <a routerLink="/event" style="text-decoration: none; color: inherit">
          @for(items of eventArray(); track $index){
          <div class="fs-6">
          <span
            ><strong class="text-danger">Function:</strong> {{items.title}}
          </span>
          <span><strong>Date:</strong> {{ items.date | date:'dd-MMMM-yyyy' }} </span>
          <span><strong>Location:</strong> {{items.location}}</span>
        </div>
        }
        </a>
        </marquee>
    </div>
  </div>
</div>
