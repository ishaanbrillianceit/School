<div class="background py-1">
  <div class="row">
    <div class="col-sm-1 bg-danger text-end">Notices:-</div>
    <div class="col-sm-11">

        <marquee
        behavior="scroll"
        direction="left"
        scrollamount="15"
        class="notice "
        onmouseover="this.stop();"
        onmouseout="this.start();"
      > @for (item of noticeArray(); track $index) {
       <span class="pe-5"> {{item}}</span>
      }
      </marquee>
    </div>
  </div>
</div>
